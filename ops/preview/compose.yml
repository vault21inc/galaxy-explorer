# The private preview's database (docs/ops/preview.md): Postgres 18, reachable from this
# server only, its data in a named volume that survives restarts and updates.
name: galaxy-explorer-preview

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ${GE_DB_PASSWORD:?set GE_DB_PASSWORD in preview.env}
      POSTGRES_DB: ge
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ge -d ge']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
