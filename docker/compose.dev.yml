# Local Postgres for development and tests (docs/plan/milestones/M0-foundation.md, M0-T3).
# Start with `pnpm db:up`, stop with `pnpm db:down`.
#
# Ports 5442 and 5443 avoid the usual 5432, which other local projects often hold.
# Both bind to 127.0.0.1 only, so the databases are never reachable from the network.
name: galaxy-explorer

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/, so mount the parent.
      - ge-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ge -d ge']
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge_test
    # Test data is disposable: keep it in memory and skip durability work for speed.
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    ports:
      - '127.0.0.1:5443:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ge -d ge_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ge-pgdata:
