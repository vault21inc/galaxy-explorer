# Checks every push to main and every pull request (D-22). Everything except `pnpm perf` runs
# here; CI has no GPU, so performance is measured on the owner's Mac (architecture.md §13).
#
# Actions are pinned to commit SHAs (with the version in a comment) so a moved tag can't change
# what runs. Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be checked by hand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The e2e suite under software rendering took about 15.5 of a run's 19.5 minutes by M5,
    # and the next run went over 20. If it nears this again, split the e2e tests across jobs
    # (Playwright's --shard) rather than raising it further.
    timeout-minutes: 35

    services:
      # The test database server, like `db-test` in docker/compose.dev.yml.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ge
          POSTGRES_PASSWORD: ge
          POSTGRES_DB: ge_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U ge -d ge_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql

    env:
      TEST_DATABASE_URL: postgres://ge:ge@127.0.0.1:5443/ge_test

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # The version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what the site runs (M8-T3): high or critical ones fail the run.
      # Development tools are left out; Dependabot keeps everything up to date. The secret scan
      # is its own workflow (secrets.yml).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Format check, lint, typecheck and unit tests
        run: pnpm check

      # The client is generated from the API's routes (M1-T10). A route change without
      # `pnpm api:generate` leaves the committed client stale, which fails here.
      - name: API client is up to date
        run: pnpm api:check

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ge/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ge/web exec playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ge/web exec playwright install-deps chromium

      - name: End-to-end tests (Chromium, software rendering)
        run: pnpm test:e2e -- --project=chromium

      # Apart from the desktop tests, not beside them: software rendering on the runner's few
      # cores slows down too much with both at once for the frame-timing tests (L3-T2).
      - name: End-to-end tests (phone, Chromium, software rendering)
        run: pnpm test:e2e -- --project=phone-chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
