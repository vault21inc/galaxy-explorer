# Deploys to the production droplet (M8-T6, docs/ops/deploy.md): on a version tag (v*), or by
# hand from the Actions tab (`gh workflow run deploy.yml --ref <branch or tag>`).
#
# 1. Build the API's, the web's and the backup's images and push them to GHCR, named by the
#    commit.
# 2. Copy the release's compose file and scripts/ops/deploy-release.sh to the droplet, log it in
#    to GHCR with this run's own token, and run the script: it pulls, migrates, starts, checks
#    /api/health, and puts the previous release back if the new one isn't healthy.
#
# The droplet and its key are the `production` environment's secrets: DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (docs/ops/deploy.md). Actions are pinned to commit
# SHAs, as in ci.yml.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One deploy at a time, and never cut short.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/vault21inc/galaxy-explorer

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit names the release; a version tag names it too, for people.
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for image in api web backup; do
            tags="$IMAGE_PREFIX-$image:$GITHUB_SHA"
            [ "$REF_TYPE" = tag ] && tags="$tags,$IMAGE_PREFIX-$image:$REF_NAME"
            echo "$image=$tags" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push the API's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          # The site's first-visit defaults (D-38): every label shown, as the preview had them.
          # Spoilers stay hidden until a reader shows them. A reader's own choice still wins.
          build-args: |
            VITE_DEFAULT_LABEL_MODE=all
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The nightly backups (M8-T7): Postgres's client tools and rclone.
      - name: Build and push the backup's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backup }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      RELEASE_DIR: /srv/galaxy-explorer/releases/${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The droplet's host key is pinned: a server answering with another key is refused.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Copy the release to the droplet
        run: |
          ssh "$DEPLOY" "mkdir -p '$RELEASE_DIR'"
          scp docker/compose.prod.yml scripts/ops/deploy-release.sh "$DEPLOY:$RELEASE_DIR/"

      - name: Deploy, or roll back
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The token lasts as long as this job; it's logged out below either way.
          printf '%s' "$REGISTRY_TOKEN" |
            ssh "$DEPLOY" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null
          ssh "$DEPLOY" "bash '$RELEASE_DIR/deploy-release.sh' '$GITHUB_SHA'"

      - name: Log the droplet out of GHCR
        if: always()
        run: ssh "$DEPLOY" 'docker logout ghcr.io' >/dev/null 2>&1 || true
