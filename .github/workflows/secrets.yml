# The secret scan (M8-T3): gitleaks looks for keys, tokens and passwords in the commits.
#
# A push or pull request scans its own commits, so every commit is scanned once as it arrives.
# A run by hand, and the weekly one, scan the whole history, which also catches what newer
# gitleaks rules learn to see:
#   gh workflow run secrets.yml --ref main
#
# gitleaks is downloaded from its GitHub release at a pinned version and checked against the
# release's SHA-256 before it runs. To update it, change both from the release's
# gitleaks_<version>_checksums.txt.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: '17 6 * * 1'

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so the scan can read whichever it's asked about.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Which commits: a push's or a pull request's own, else (by hand, weekly) all of them.
          # A push that starts a branch has no "before" (all zeros), so it scans everything.
          range=""
          if [ "$EVENT" = push ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          fi
          echo "Scanning ${range:-the whole history}."
          # --redact keeps any secret it finds out of the log, which anyone with access can read.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            ${range:+--log-opts="$range"} .
