packages:
  - apps/*
  - packages/*
  - scripts/*

# Tool versions, pinned once for every package. Package manifests refer to them as "catalog:".
catalog:
  '@eslint/js': 10.0.1
  # Used by the web app's end-to-end tests and by `pnpm perf`.
  '@playwright/test': 1.65.0
  '@types/node': 26.6.6
  eslint: 10.14.0
  '@types/pg': 8.23.1
  drizzle-orm: 0.45.4
  globals: 17.14.0
  pg: 8.23.1
  prettier: 3.9.10
  turbo: 2.11.10
  # typescript-eslint 8 supports TypeScript below 6.1, so TypeScript 7 (the native port) waits for it.
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.1.0
  zod: 4.6.7

# Record exact versions when dependencies are added.
savePrefix: ''

# Packages allowed to run install scripts. esbuild (pulled in by drizzle-kit) only uses its
# script to double-check its platform binary, which pnpm already installs, so it stays off.
allowBuilds:
  esbuild: false

# openapi-typescript 7 declares TypeScript 5 as a peer, but generates the API client correctly
# with our TypeScript 6 (M1-T10); CI's freshness check would show any difference.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
